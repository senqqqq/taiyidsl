name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      UV_LINK_MODE: copy
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install Node for HTML script validation
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run offline tests
        run: uv run --locked pytest --basetemp=.test-tmp-pytest --junitxml=output/test-results.xml

      - name: Run tune-up workflow
        if: matrix.os == 'ubuntu-latest'
        run: uv run --locked python examples/tuneup_workflow.py

      - name: Run initialization workflow
        if: matrix.os == 'ubuntu-latest'
        run: uv run --locked python examples/state_initialization.py

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Retain offline reports and distributions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-results-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/test-results.xml
            output/tuneup_workflow/
            output/state_initialization/
            dist/
