[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "taiyidsl"
version = "0.1.0"
description = "Offline-first neutral-atom pulse experiments and ARTIQ export"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "plotly>=6,<7",
    "xarray>=2024.10,<2027",
    "h5py>=3.12,<4",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
spectrum = [
    "spcm>=1.13.4,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
notebooks = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.3,<5",
    "jupyter-client>=8.6,<9",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".uv-cache",
    ".toolchains",
    ".test-tmp*",
    ".pytest-tmp*",
    "output",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/scripts",
    "/docs",
    "/README.md",
    "/CONTRIBUTING.md",
    "/AGENTS.md",
    "/.github",
    "/.gitignore",
    "/.gitattributes",
    "/pyproject.toml",
    "/uv.lock",
    "/flake.nix",
    "/flake.lock",
    "/.python-version",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taiyidsl"]
