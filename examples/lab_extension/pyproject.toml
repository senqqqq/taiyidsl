[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "taiyidsl-lab-example"
version = "0.1.0"
description = "Offline laboratory extension example for TaiyiDSL"
requires-python = ">=3.12,<3.13"
dependencies = ["taiyidsl>=0.1,<0.2", "numpy>=2.1,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/my_lab"]
