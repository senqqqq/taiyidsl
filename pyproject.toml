[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "taiyidsl"
version = "0.1.0"
description = "Offline-first neutral-atom pulse experiments and ARTIQ export"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "plotly>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".uv-cache",
    ".test-tmp*",
    ".pytest-tmp*",
    "output",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taiyidsl"]
